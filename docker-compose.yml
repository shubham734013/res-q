# Local development database only. The app itself runs with npm.
services:
  postgres:
    image: postgres:16-alpine
    container_name: resq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resq
      POSTGRES_PASSWORD: resq
      POSTGRES_DB: resq
    ports:
      - '5432:5432'
    volumes:
      - resq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resq -d resq']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resq-pgdata:
